# Optional, isolated no-auth demo MCP. Never deploy with real vehicle data.
# Preserve local compose.yaml changes (e.g. host port 18767) using -f.
services:
  voice-demo:
    build: .
    command: python -m app.voice_demo_server
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      ALLOW_VOICE_PROPOSALS: ${ALLOW_VOICE_PROPOSALS:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
