name: Product v1 actual Java Agent to PostgreSQL E2E

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'tests/e2e/agent_v1_snapshot/**'
      - 'product_v1/**'
      - '.github/workflows/product-v1-java-agent-e2e.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'tests/e2e/agent_v1_snapshot/**'
      - 'product_v1/**'
      - '.github/workflows/product-v1-java-agent-e2e.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-agent-v1-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-postgres:
    name: Pinned Java 8 Agent -> FastAPI -> PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: romlogger
          POSTGRES_DB: romlogger_java_e2e
          POSTGRES_PASSWORD: disposable_ci_java_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U romlogger -d romlogger_java_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://romlogger:disposable_ci_java_e2e@127.0.0.1:5432/romlogger_java_e2e
      ROMLOGGER_SERVER_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Cache verified Java test dependencies
        uses: actions/cache@v4
        with:
          path: |
            tests/e2e/agent_v1_snapshot/lib/sqlite-jdbc.jar
            tests/e2e/agent_v1_snapshot/lib/slf4j-api.jar
            tests/e2e/agent_v1_snapshot/lib/slf4j-nop.jar
          key: pinned-java-agent-e2e-linux-3.46.1.3-slf4j-2.0.16
      - name: Install Python product runtime
        run: python -m pip install -r requirements.txt
      - name: Verify pinned Agent blobs and compile Java8 source
        run: bash tests/e2e/agent_v1_snapshot/scripts/prepare-agent-e2e.sh
      - name: Run genuine Java -> FastAPI -> PostgreSQL delivery and replay
        run: |
          cd tests/e2e/agent_v1_snapshot
          bash scripts/test-product-v1-real-server.sh
          echo "### PASS: pinned Agent Java8 source → SQLite → FastAPI → PostgreSQL 16" >> "$GITHUB_STEP_SUMMARY"
          echo "Agent source commit: 6dd46835a200d961d517f5bb54f11eb2d7bdd2af" >> "$GITHUB_STEP_SUMMARY"
      - name: Report failure without publishing token/logs
        if: failure()
        run: |
          echo "### FAIL: actual Java/PostgreSQL E2E; never infer success from mock CI" >> "$GITHUB_STEP_SUMMARY"
